name: Build and Deploy to develop-builds

on:
  push:
    branches:
      - develop
      - main
  workflow_dispatch:  # Allow manual trigger

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write  # Required to push to branches
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0  # Fetch all branches and history
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      
      - name: Install dependencies
        run: |
          echo "📦 Installing npm dependencies..."
          npm ci
      
      - name: Build blocks
        run: |
          echo "🔨 Building blocks..."
          npm run prepublish
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Commit build artifacts
        id: commit
        run: |
          # Check if there are changes to commit
          git add -A
          
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore: build blocks [skip ci]"
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi
      
      - name: Push to develop-builds
        if: steps.commit.outputs.has_changes == 'true'
        run: |
          echo "🚀 Pushing to develop-builds branch..."
          
          # Check if develop-builds branch exists remotely
          if git ls-remote --heads origin develop-builds | grep develop-builds; then
            echo "Branch develop-builds exists, fetching..."
            git fetch origin develop-builds
            
            # Check out develop-builds and merge current branch
            git checkout -B develop-builds
            git merge --strategy-option=theirs --no-ff -m "Merge build from ${{ github.ref_name }}" ${{ github.sha }}
          else
            echo "Branch develop-builds does not exist, creating..."
            git checkout -b develop-builds
          fi
          
          # Push to develop-builds
          git push origin develop-builds --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Summary
        run: |
          if [ "${{ steps.commit.outputs.has_changes }}" == "true" ]; then
            echo "✅ Successfully built and pushed to develop-builds"
          else
            echo "ℹ️ No build changes to deploy"
          fi
